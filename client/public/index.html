<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="[Your Name]'s Professional Portfolio - Showcasing projects, skills, and experience in web development."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      The manifest.json file enforces PWA (Progressive Web App) standards.
      It's used by browsers to provide a richer user experience on mobile devices.
      Learn more: https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>[Your Name] | Full-Stack Developer Portfolio</title>
    <!--
      Preload critical CSS for faster initial render.
      While main.css is typically bundled and injected by Webpack in a CRA app,
      for a more robust setup or if using a custom build, preloading can be beneficial.
      In a standard Create React App, this might be handled by the build process.
      For this project, we'll assume `main.css` is the primary stylesheet.
    -->
    <link rel="preload" href="%PUBLIC_URL%/static/css/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="%PUBLIC_URL%/static/css/main.css"></noscript>
  </head>
  <body>
    <!--
      A <noscript> tag is used to display content to users whose browsers
      do not support scripts or have scripting disabled.
      In a React app, if JavaScript is disabled, the app won't render.
    -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      This is the root element where our React application will be mounted.
      The `id="root"` is a common convention for Create React App.
    -->
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
